name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Cos-Info.plist)"
          test "$tag_version" = "$app_version"
      - name: Test native core
        run: swift test --scratch-path "$RUNNER_TEMP/cos-tests"
      - name: Test marketplace
        run: npm test --prefix web
      - name: Package app
        run: scripts/build_release.sh
      - name: Package source and checksums
        run: |
          git archive --format=zip --output outputs/Cos-Source.zip "$GITHUB_REF_NAME"
          (cd outputs && shasum -a 256 Cos-*.dmg Cos-*-macOS-*.zip Cos-Source.zip > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          gh release create "$GITHUB_REF_NAME" \
            "outputs/Cos-$version.dmg" \
            "outputs/Cos-$version-macOS-$arch.zip" \
            "outputs/Cos-Source.zip" \
            "outputs/SHA256SUMS.txt" \
            --title "Cos $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag
